name: Arithmetic Formatter tests

on:
  push:
    paths:
      - arithmetic-formatter/**
      - .github/workflows/arithmetic-formatter-tests.yml

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set-up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Install flake8
        run: python -m pip install flake8

      - name: Execute flake8
        run: python -m flake8 .
        working-directory: arithmetic-formatter

      - name: Execute pytest tests
        run: python -m pytest -v
        working-directory: arithmetic-formatter
